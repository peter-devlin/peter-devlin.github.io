<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Peter</title>
  <link rel="stylesheet" href="style.css?v=7">
</head>
<body>

  <div id="boot" class="boot">
    <div class="boot-lines">
      <p id="b0"></p>
      <p id="b1"></p>
      <p id="b2"></p>
      <p id="b3"></p>
    </div>
  </div>

  <main id="site" class="site-hidden">
    <nav class="fade-in">
      <a href="#about">about</a>
      <a href="#writings">writing</a>
    </nav>

    <section id="about" class="about">
      <h1 class="fade-in">Peter</h1>
      <div class="bio fade-in" style="animation-delay: 0.1s;">
        <p><!-- Your bio here. --></p>
        <p><!-- Second paragraph if you want. --></p>
      </div>
      <div class="elsewhere fade-in" style="animation-delay: 0.2s;">
        <!-- Uncomment the ones you want -->
        <!-- <span class="elsewhere-label">Elsewhere</span> -->
        <!-- <a href="https://twitter.com/yourhandle">Twitter</a> -->
        <!-- <a href="https://linkedin.com/in/yourprofile">LinkedIn</a> -->
        <!-- <a href="mailto:you@email.com">Email</a> -->
      </div>
    </section>

    <section id="writings" class="writings">
      <!-- TEMPLATE: Copy this block for each new post -->
      <!--
      <a href="posts/your-post-slug.html" class="post fade-in">
        <span class="post-title">Post Title Here</span>
        <span class="post-date">Mar 2026</span>
      </a>
      -->

    </section>

    <footer></footer>
  </main>

  <script>
    // Boot sequence — only once per session
    const boot = document.getElementById('boot');
    const site = document.getElementById('site');

    const lines = [
      { id: 'b0', text: 'loading kernel...',      delay: 0 },
      { id: 'b1', text: 'mounting /dev/mind',     delay: 400 },
      { id: 'b2', text: 'establishing connection', delay: 900 },
      { id: 'b3', text: 'ready.',                  delay: 1500 },
    ];

    function showSite() {
      boot.classList.add('boot-done');
      setTimeout(() => {
        boot.style.display = 'none';
        site.classList.remove('site-hidden');
        // trigger fade-ins
        const obs = new IntersectionObserver((entries) => {
          entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('visible'); });
        }, { threshold: 0.1 });
        document.querySelectorAll('.fade-in').forEach(el => obs.observe(el));
      }, 600);
    }

    if (sessionStorage.getItem('booted')) {
      boot.style.display = 'none';
      site.classList.remove('site-hidden');
      const obs = new IntersectionObserver((entries) => {
        entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('visible'); });
      }, { threshold: 0.1 });
      document.querySelectorAll('.fade-in').forEach(el => obs.observe(el));
    } else {
      lines.forEach(({ id, text, delay }) => {
        setTimeout(() => {
          const el = document.getElementById(id);
          let i = 0;
          const type = setInterval(() => {
            el.textContent = text.slice(0, i + 1);
            i++;
            if (i >= text.length) clearInterval(type);
          }, 30);
        }, delay);
      });
      setTimeout(() => {
        sessionStorage.setItem('booted', '1');
        showSite();
      }, 2400);
    }
  </script>

</body>
</html>
