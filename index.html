    <section id="about" class="about">
      <h1 class="fade-in"><span class="greeting">Hey, I'm </span>Peter</h1>

    <footer></footer>
  </main>

  <script>
    // Boot sequence — only once per session
    const boot = document.getElementById('boot');
    const site = document.getElementById('site');

    const lines = [
      { id: 'b0', text: 'Observing',                  delay: 0 },
      { id: 'b1', text: 'Generating World Model',    delay: 500 },
      { id: 'b2', text: 'Identifying Anomalies',     delay: 1100 },
      { id: 'b3', text: 'Recalibrating\u2026',       delay: 1700 },
      { id: 'b4', text: 'Recalibrating\u2026',       delay: 2200 },
    ];

    function showSite() {
      boot.classList.add('boot-done');
      setTimeout(() => {
        boot.style.display = 'none';
        site.classList.remove('site-hidden');
        // trigger fade-ins
        const obs = new IntersectionObserver((entries) => {
          entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('visible'); });
        }, { threshold: 0.1 });
        document.querySelectorAll('.fade-in').forEach(el => obs.observe(el));
      }, 600);
    }

    const hasHash = window.location.hash && window.location.hash !== '';
    const cameFromInternal = document.referrer.includes('peter-devlin.github.io');

    if (hasHash || cameFromInternal) {
      boot.style.display = 'none';
      site.classList.remove('site-hidden');
      const obs = new IntersectionObserver((entries) => {
        entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('visible'); });
      }, { threshold: 0.1 });
      document.querySelectorAll('.fade-in').forEach(el => obs.observe(el));
    } else {
      lines.forEach(({ id, text, delay }) => {
        setTimeout(() => {
          const el = document.getElementById(id);
          let i = 0;
          const type = setInterval(() => {
            el.textContent = text.slice(0, i + 1);
            i++;
            if (i >= text.length) clearInterval(type);
          }, 30);
        }, delay);
      });
      setTimeout(showSite, 3200);
    }
  </script>

</body>
</html>
