<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Peter</title>
  <link rel="stylesheet" href="style.css?v=4">
</head>
<body>

  <nav>
    <a href="#" class="nav-name">Peter</a>
    <div class="nav-links">
      <a href="#about">About</a>
      <a href="#writings">Writing</a>
    </div>
  </nav>

  <section id="about" class="section about">
    <div class="container">
      <h1 class="fade-in">Peter</h1>
      <div class="bio fade-in" style="animation-delay: 0.15s;">
        <p><!-- Your bio here. A few sentences about who you are, what you care about. --></p>
        <p><!-- Second paragraph if you want. --></p>
      </div>
      <div class="links fade-in" style="animation-delay: 0.3s;">
        <!-- Uncomment the ones you want -->
        <!-- <a href="https://twitter.com/yourhandle">Twitter</a> -->
        <!-- <a href="https://linkedin.com/in/yourprofile">LinkedIn</a> -->
        <!-- <a href="mailto:you@email.com">Email</a> -->
      </div>
    </div>
  </section>

  <section id="writings" class="section writings">
    <div class="container">
      <h2 class="fade-in">Writing</h2>
      <div class="writings-list">

        <!-- TEMPLATE: Copy this block for each new post -->
        <!--
        <article class="post fade-in">
          <a href="posts/your-post-slug.html">
            <span class="post-title">Post Title Here</span>
            <span class="post-date">Mar 2026</span>
          </a>
        </article>
        -->

      </div>
    </div>
  </section>

  <footer>
    <div class="container">
      <p>close this world. open the next.</p>
    </div>
  </footer>

  <script>
    const obs = new IntersectionObserver((entries) => {
      entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('visible'); });
    }, { threshold: 0.1 });
    document.querySelectorAll('.fade-in').forEach(el => obs.observe(el));
  </script>

</body>
</html>
